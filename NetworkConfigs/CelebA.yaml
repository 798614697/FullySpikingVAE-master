Network:
  # 原始无条件 FSVAE baseline；没有 conditional/condition_dim 字段时，
  # fscvae.py 自动令 condition_dim=0，不创建任何条件模块。
  epochs: 150
  batch_size: 250
  n_steps: 16 # timestep
  dataset: "CelebA"
  in_channels: 3
  data_path: "./data"
  lr: 0.001
  latent_dim: 128
  input_size: 64
  model: "FSCVAE_large" # FSCVAE or FSCVAE_large
  k: 20 # multiplier of channel
  scheduled: true # whether to apply scheduled sampling
  loss_func: 'mmd' # mmd or kld

  # Runtime controls for faster long CelebA runs.
  # Set metric_interval to 0 to skip expensive FID/IS metrics during training.
  test_interval: 5
  sample_interval: 5
  checkpoint_interval: 5
  weight_hist_interval: 0
  metric_interval: 0
  sample_batch_size: 64
  enable_inception_score: false
  enable_autoencoder_fid: false
  enable_clean_fid: false


  
