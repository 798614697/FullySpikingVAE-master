Network:
  # 门控消融：保留 LIF 时间条件编码，但把软门控替换为直接相加。
  # 与 CelebA_CVAE_Temporal.yaml 的唯一本质差异是 injection_type。
  epochs: 100
  batch_size: 64
  n_steps: 16
  dataset: "CelebA"
  in_channels: 3
  data_path: "./data"
  lr: 0.001
  lr_decay_epochs: [30]
  lr_decay_gamma: 0.1
  latent_dim: 128
  input_size: 64
  model: "FSCVAE_large"
  conditional: true
  condition_dim: 40
  condition_embed_dim: 64
  temporal_condition_mode: 'lif'
  injection_type: 'additive'
  k: 20
  scheduled: true
  loss_func: 'mmd'
  lambda_cond: 1.0
  lambda_cc: 0.0
  lambda_temp: 0.0

  test_interval: 5
  sample_interval: 5
  checkpoint_interval: 5
  weight_hist_interval: 0
  metric_interval: 0
  sample_batch_size: 64
  enable_inception_score: false
  enable_autoencoder_fid: false
  enable_clean_fid: false
